[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "octalum-bdtb"
version = "0.2.0"
description = "Brain-Dump-to-Build: turn raw idea-dumps into github/spec-kit-shaped plans (spec.md, plan.md, tasks.md). Ships as a Claude Code Skill in the OCTALUM family."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohamed Harery", email = "mohamed@harery.com" }]
keywords = [
    "spec-kit", "spec-driven-development", "claude-code", "claude-code-skill",
    "scaffolding", "planning", "sdlc", "brainstorm", "ideation",
    "octalum", "octalume", "bdtb",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4", "mypy>=1.8"]
llm = []  # placeholder; users opt in to anthropic/openai/ollama themselves

[project.scripts]
octalum-bdtb = "octalum_bdtb.cli:main"
bdtb = "octalum_bdtb.cli:main"

[project.urls]
Homepage = "https://harery.com"
Repository = "https://github.com/Harery/octalum-bdtb"
Issues = "https://github.com/Harery/octalum-bdtb/issues"
"OCTALUM family" = "https://github.com/Harery/OCTALUME"
"Composes with" = "https://github.com/github/spec-kit"

[tool.hatch.build.targets.wheel]
packages = ["src/octalum_bdtb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["octalum_bdtb"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
