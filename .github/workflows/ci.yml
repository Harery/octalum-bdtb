name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Typecheck
        run: mypy src

      - name: Test
        run: pytest -q --strict-markers --strict-config --cov=octalum_bdtb --cov-report=term-missing --cov-fail-under=80

      - name: Smoke test CLI (octalum-classic target)
        run: |
          octalum-bdtb examples/saas/brain-dump.md --output-dir /tmp/out-classic --target octalum-classic
          test -f /tmp/out-classic/PHASES.md
          test -f /tmp/out-classic/STACK.md
          test -x /tmp/out-classic/BUILD_NOW.sh

      - name: Smoke test CLI (spec-kit target, default)
        run: |
          octalum-bdtb examples/saas/brain-dump.md --output-dir /tmp/out-speckit
          test -f /tmp/out-speckit/memory/constitution.md
          ls /tmp/out-speckit/specs/*/spec.md
          ls /tmp/out-speckit/specs/*/plan.md
          ls /tmp/out-speckit/specs/*/tasks.md
