name: Bug report
description: Something broke or behaved unexpectedly.
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. The more detail you give, the faster we can fix it.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `octalum-bdtb --version`.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.6"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows (WSL)
        - Other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Write a brain-dump containing …
        2. Run `octalum-bdtb dump.md -o ./plan`
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behaviour
    validations:
      required: true
  - type: textarea
    id: dump
    attributes:
      label: Minimal brain-dump that reproduces the issue (sanitised)
      render: markdown
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      render: shell
