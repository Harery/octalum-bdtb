name: Feature request
description: Suggest a new capability or improvement.
title: "[feat] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: When I try to …, I have to …
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      multiple: true
      options:
        - CLI
        - Claude Code Skill
        - Templates / output format
        - LLM integration
        - Docs
  - type: checkboxes
    id: contribution
    attributes:
      label: Are you willing to contribute a PR?
      options:
        - label: Yes, I can open a PR for this.
        - label: I can help test it.
